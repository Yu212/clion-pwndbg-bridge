name: Build and Publish Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/libs/pwndbg-bridge-1.0.jar dist/pwndbg-bridge-latest.jar
          cp build/distributions/pwndbg-bridge-1.0.zip dist/pwndbg-bridge-latest.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: dist/*

      - name: Publish rolling latest release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest build
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: dist/pwndbg-bridge-latest.jar,dist/pwndbg-bridge-latest.zip
          body: |
            Auto-updated from `main`.
            - Commit: `${{ github.sha }}`
